# =============================================================
# Nginx — LLM Security Lab Reverse Proxy
# Home Server Edition: routes LAN traffic to containers
# =============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 512;     # Low for home server
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $request_method [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Upstream definitions ───────────────────────────────
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 4;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 4;
    }

    # ── Main server block ──────────────────────────────────
    server {
        listen 80;
        server_name _;     # Match any hostname / IP

        # ── Health check (used by Docker healthcheck) ──────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Backend API — /api/* → FastAPI :8000 ───────────
        location /api/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";

            # Long timeouts for LLM inference (CPU is slow!)
            proxy_read_timeout    240s;
            proxy_send_timeout    240s;
            proxy_connect_timeout  10s;

            # Allow larger request bodies (for long prompts)
            client_max_body_size 2m;

            # CORS headers (belt-and-suspenders with FastAPI CORS middleware)
            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ── FastAPI Docs (dev convenience) ────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # ── Next.js Frontend — everything else ────────────
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";   # For Next.js HMR websocket

            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;

            # Disable caching for dev mode hot reload
            add_header Cache-Control "no-store, no-cache" always;
        }

        # ── Next.js Hot Module Replacement WebSocket ───────
        location /_next/webpack-hmr {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # Static Next.js assets
        location /_next/static/ {
            proxy_pass         http://frontend_upstream;
            proxy_cache_valid  200 1d;
            add_header         Cache-Control "public, max-age=86400";
        }
    }
}
